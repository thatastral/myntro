<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F5F7">
<meta name="robots" content="noindex,nofollow">
<title>Momentum</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" hidden>
  <aside class="side">
    <a class="logo" href="#/"><i></i>Momentum</a>
    <nav class="side-nav" id="sideNav" aria-label="Primary"></nav>
    <div class="side-foot">
      <button class="sync" id="syncSide" data-do="refresh" title="Refresh now"></button>
      <button class="link-btn" data-do="logout">Sign out</button>
    </div>
  </aside>
  <header class="topbar">
    <a class="logo" href="#/"><i></i>Momentum</a>
    <button class="sync" id="syncTop" data-do="refresh" title="Refresh now"></button>
  </header>
  <main id="view" aria-live="polite"></main>
  <nav class="bottom" id="bottomNav" aria-label="Primary"></nav>
</div>

<div id="login" hidden>
  <form class="login-card" id="loginForm" autocomplete="on">
    <a class="logo big-logo" href="#/"><i></i>Momentum</a>
    <p class="sub">Your daily driver, at a glance.</p>
    <label>Passcode<input id="passcode" name="passcode" type="password" autocomplete="current-password" required autofocus></label>
    <p class="login-err" id="loginErr" role="alert"></p>
    <button class="primary full" type="submit">Open Momentum</button>
  </form>
</div>

<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
